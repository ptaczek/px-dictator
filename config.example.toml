[general]
enabled = true
activation_mode = "push-to-talk"   # or "toggle"

[audio]
device = ""                        # substring match, index number, or empty for default
sample_rate = 16000

[hotkey]
key = "KEY_RIGHTALT"               # evdev key name
device = ""                        # auto-detect if empty

[transcription]
engine = "whisper"                 # "sherpa-onnx" or "whisper"
host = "127.0.0.1"
port = 6006
model = "parakeet-tdt-0.6b-v3"    # sherpa-onnx model (used when engine = sherpa-onnx)
sherpa_language = "en"             # language for sherpa-onnx (depends on model)
whisper_model = "ggml-medium.bin"  # whisper model (used when engine = whisper)
whisper_language = "auto"          # language code: "auto", "en", "cs", "de", etc.
whisper_translate = false          # translate to English (Whisper only)

[enhancement]
enabled = true
host = "127.0.0.1"
port = 8200
model = "Qwen3-1.7B-Q8_0.gguf"
gpu_layers = 99
ctx_size = 4096
system_prompt = """Fix grammar, punctuation and casing.
Keep the original meaning. Output only the corrected text."""

[paste]
session = "auto"                   # "auto", "xorg", or "wayland"
delay_ms = 100
terminal_classes = ["kitty", "Alacritty", "gnome-terminal-server", "tilix",
                    "konsole", "xfce4-terminal", "terminator", "st",
                    "urxvt", "xterm", "foot", "wezterm"]
